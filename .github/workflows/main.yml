name: Pipeline CI/CD Portfolio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Index.html
        run: |
          if [ ! -f "index.html" ]; then
            echo "Erro: arquivo index.html nao encontrado na raiz."
            exit 1
          fi

      - name: File Size Check
        run: |
          LARGE_FILES=$(find . -type f -not -path '*/.*' -size +500k)
          if [ ! -z "$LARGE_FILES" ]; then
            echo "Erro: Arquivos maiores que 500KB encontrados: $LARGE_FILES"
            exit 1
          fi

      - name: Scan Prohibited Terms
        run: |
          if grep -rEi "TODO|FIXME|senha|password" . --exclude-dir=.git; then
            echo "Erro: Foram encontrados termos proibidos ou comentarios pendentes."
            exit 1
          fi

      - name: Run Linter
        run: |
          npm install -g html-validate
          html-validate index.html

  deploy:
    needs: lint-and-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [lint-and-validate, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification
        run: echo "A pipeline falhou. Verifique os logs na aba Actions."